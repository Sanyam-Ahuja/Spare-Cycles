services:
  # --- Database ---
  postgres:
    image: postgres:16-alpine
    container_name: campugrid-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campugrid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campugrid_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-campugrid}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campugrid}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Redis Queue ---
  redis:
    image: redis:7-alpine
    container_name: campugrid-redis
    restart: always
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --save 60 1000
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- S3 Object Storage ---
  minio:
    # minio/minio is no longer published on Docker Hub; Chainguard builds it from source.
    # The image has no shell or mc, so there is no healthcheck (services retry on start).
    image: cgr.dev/chainguard/minio:latest
    container_name: campugrid-minio
    restart: always
    user: "0:0"   # write access to the fresh named volume
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-campugrid}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-campugrid_dev_secret}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data

  # --- Private Docker Registry for Contributor Containers ---
  registry:
    image: registry:2
    container_name: campugrid-registry
    restart: always
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - registrydata:/var/lib/registry
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"

  # --- Backend REST & WS Gateway ---
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: campugrid-server
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_SECURE=false
      - PUBLIC_MINIO_ENDPOINT=s3-sparecycles.sahuja.in
      - PUBLIC_MINIO_SECURE=true
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - CORS_ORIGINS=["https://sparecycles.sahuja.in"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  # --- Celery Worker ---
  celery_worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: campugrid-celery-worker
    restart: always
    command: celery -A app.celery_worker.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_SECURE=false
      - PUBLIC_MINIO_ENDPOINT=s3-sparecycles.sahuja.in
      - PUBLIC_MINIO_SECURE=true
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- Celery Beat (Watchdog Scheduler) ---
  celery_beat:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: campugrid-celery-beat
    restart: always
    command: celery -A app.celery_worker.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_SECURE=false
      - PUBLIC_MINIO_ENDPOINT=s3-sparecycles.sahuja.in
      - PUBLIC_MINIO_SECURE=true
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- Next.js Consumer Web App ---
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://sparecycles.sahuja.in/api/v1
        - NEXT_PUBLIC_WS_URL=wss://sparecycles.sahuja.in
    container_name: campugrid-web
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NEXTAUTH_SECRET=${JWT_SECRET_KEY}
      - NEXTAUTH_URL=https://sparecycles.sahuja.in
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - API_URL=http://server:8000/api/v1
    depends_on:
      - server

  # --- Reverse proxy: HTTPS for sparecycles.sahuja.in + s3-sparecycles.sahuja.in ---
  caddy:
    image: caddy:2-alpine
    container_name: campugrid-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server
      - web
      - minio

volumes:
  pgdata:
  redisdata:
  miniodata:
  registrydata:
  caddy_data:
  caddy_config:
